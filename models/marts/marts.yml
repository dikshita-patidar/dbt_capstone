version: 2

models:
  - name: dim_customers
    description: "Customer profile with order metrics. One row per customer."
    columns:
      - name: customer_id
        description: "Primary key."
        data_tests:
          - unique
          - not_null

  - name: fct_orders
    description: "Transactions. One row per order."
    columns:
      - name: order_id
        description: "Primary key."
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to dim_customers."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: order_amount
        description: "Order amount."
        data_tests:
          - not_null